<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="title desc">
  <title id="title">Biryani Spot Family Restaurant</title>
  <desc id="desc">Premium warm-toned Biryani Spot restaurant emblem with a realistic biryani handi, natural steam and heritage skyline.</desc>
  <defs>
    <radialGradient id="paper" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#f0e4d2"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8d5418"/>
      <stop offset=".45" stop-color="#d5a34c"/>
      <stop offset="1" stop-color="#7b4615"/>
    </linearGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#e0a15d"/>
      <stop offset=".45" stop-color="#ad5c2b"/>
      <stop offset="1" stop-color="#71391f"/>
    </linearGradient>
    <linearGradient id="rice" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fff1b8"/>
      <stop offset="1" stop-color="#e9b54d"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#4d2918" flood-opacity=".18"/>
    </filter>
    <filter id="steamBlur">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <circle cx="360" cy="360" r="344" fill="url(#paper)" stroke="url(#gold)" stroke-width="8"/>
  <circle cx="360" cy="360" r="318" fill="none" stroke="#6c2b20" stroke-width="3" opacity=".8"/>

  <!-- Heritage skyline kept deliberately light so the food remains the focus. -->
  <g fill="#6d3925" opacity=".72">
    <path d="M105 330h510v8H105z"/>
    <path d="M137 329v-53h38v53zm7-53q12-28 24 0z"/>
    <path d="M196 329v-78h48v78zm9-78q15-34 30 0z"/>
    <path d="M475 329v-78h48v78zm9-78q15-34 30 0z"/>
    <path d="M547 329v-53h38v53zm7-53q12-28 24 0z"/>
    <path d="M257 329v-47h33v47zm5-47q11-22 22 0zM430 329v-47h33v47zm5-47q11-22 22 0z"/>
  </g>
  <g fill="none" stroke="#7a4a32" stroke-width="3" opacity=".58">
    <path d="M92 331q22-42 44 0M584 331q22-42 44 0"/>
    <path d="M116 331q16-28 32 0M572 331q16-28 32 0"/>
  </g>
  <g fill="#58714b" opacity=".9">
    <path d="M112 332c-6-28 4-61 15-76 13 25 19 51 9 76z"/>
    <path d="M602 332c6-28-4-61-15-76-13 25-19 51-9 76z"/>
  </g>

  <!-- Natural-looking steam -->
  <g fill="none" stroke="#fffaf0" stroke-linecap="round" opacity=".78" filter="url(#steamBlur)">
    <path d="M306 254c-24-30 18-42-3-76-19-31 18-47 7-74" stroke-width="13"/>
    <path d="M355 251c26-29-17-45 5-78 21-31-16-46-4-76" stroke-width="15"/>
    <path d="M405 253c23-26-14-44 7-72 21-28-12-46 2-69" stroke-width="11"/>
  </g>

  <!-- Handi and biryani -->
  <g filter="url(#softShadow)">
    <ellipse cx="360" cy="318" rx="174" ry="42" fill="#743a21" stroke="#542919" stroke-width="5"/>
    <ellipse cx="360" cy="313" rx="164" ry="38" fill="url(#rice)" stroke="#7a3e20" stroke-width="5"/>
    <path d="M213 314c14 91 61 126 147 128 86-2 133-37 147-128-43 22-93 31-147 31s-104-9-147-31z" fill="url(#copper)" stroke="#65331e" stroke-width="6"/>
    <path d="M229 326c31 15 78 22 131 22s100-7 131-22" fill="none" stroke="#f0b76b" stroke-width="5" opacity=".55"/>
    <path d="M250 305q23-28 48-4t44-1 45 2 45-2 43 6" fill="none" stroke="#fff0b0" stroke-width="10" stroke-linecap="round"/>
    <path d="M258 289q20-16 39 2M332 280q18-16 36 3M411 285q21-17 40 2" fill="none" stroke="#dca445" stroke-width="8" stroke-linecap="round"/>
    <path d="M314 292c18-17 37-15 51 3-5 22-21 33-43 28-12-8-15-18-8-31z" fill="#9a4b23"/>
    <path d="M335 287c14-15 29-13 39 2" fill="none" stroke="#efc06d" stroke-width="4"/>
    <path d="M286 305l-11-13m12 18l-16-5m131 8l11-14m-7 20l17-6" stroke="#4f7044" stroke-width="7" stroke-linecap="round"/>
    <circle cx="280" cy="286" r="6" fill="#6f2a1d"/>
    <circle cx="382" cy="300" r="6" fill="#6f2a1d"/>
    <circle cx="444" cy="292" r="6" fill="#6f2a1d"/>
  </g>

  <!-- Wordmark -->
  <text x="360" y="486" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="67" font-weight="700" letter-spacing="1" fill="#4b2119">BIRYANI</text>
  <text x="360" y="548" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="59" font-weight="700" letter-spacing="2" fill="url(#gold)">SPOT</text>
  <path d="M156 570h150M414 570h150" stroke="#a8752b" stroke-width="3"/>
  <path d="M360 558l9 13-9 13-9-13z" fill="#6c2b20"/>
  <text x="360" y="602" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="4" fill="#5c3a2c">FAMILY RESTAURANT</text>
  <path d="M286 623h148" stroke="#b18443" stroke-width="2"/>
  <text x="360" y="647" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2.4" fill="#7b6758">TRADITION • TASTE • TOGETHER</text>
</svg>
